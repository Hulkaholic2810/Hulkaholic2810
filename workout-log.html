<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F8F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- page:start -->
<title>Pocket Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: a dot-grid bullet-journal page. 20px dot pitch; rows are 40px (two dots); bullets hang in a 36px left column. */
:root {
  --paper: #F9F8F6;
  --ink: #1A1A1A;
  --slate: #7A7872;
  --hair: #E2E0D8;
  --dot: #D3D1C9;
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --row: 40px;
  --bul: 36px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  background-color: var(--paper);
  background-image: radial-gradient(circle at center, var(--dot) 0.9px, transparent 1.3px);
  background-size: 20px 20px;
  background-position: 10px 10px;
}
body {
  margin: 0; color: var(--ink);
  font: 16px/1.4 var(--serif);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
input::placeholder { color: var(--slate); opacity: .55; }
:focus-visible { outline: 1px dashed var(--ink); outline-offset: 2px; }
input:focus, input:focus-visible { outline: none; }

.book { max-width: 600px; margin: 0 auto; padding-bottom: 96px; }
.gut {
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.head { padding-block: 20px 12px; border-bottom: 1px solid var(--hair); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: var(--row); }
.datenav { display: flex; align-items: center; margin-left: -10px; min-width: 0; }
.arrow {
  width: 32px; height: var(--row); display: grid; place-items: center;
  font-family: var(--mono); font-size: 14px; color: var(--slate);
}
.arrow:hover { color: var(--ink); }
.date { font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: .12em; white-space: nowrap; padding: 0 4px; }
.date .sep { color: var(--slate); font-weight: 400; padding: 0 .1em; }
.unit {
  font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; color: var(--slate);
  height: var(--row); white-space: nowrap; margin-right: -4px; padding: 0 4px;
}
.unit b { color: var(--ink); font-weight: 500; }

.title {
  width: 100%; border: 0; background: transparent; padding: 8px 0 4px;
  font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.15; letter-spacing: -.012em;
}
.title::placeholder { font-style: italic; font-weight: 400; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; min-height: 28px; }
.summary { font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em; color: var(--slate); font-variant-numeric: tabular-nums; }
.todaybtn {
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 4px; min-height: 28px;
}
.sample { font-family: var(--mono); font-size: 11px; color: var(--slate); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.sample button { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }

/* ---------- exercises ---------- */
.ex { padding-block: 10px 6px; border-bottom: 1px solid var(--hair); }
.ex-head { display: flex; align-items: center; height: var(--row); gap: 8px; }
.name {
  flex: 1; min-width: 0; height: var(--row); border: 0; padding: 0; background: transparent; border-radius: 0;
  font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -.005em;
}
.name::placeholder { font-style: italic; font-weight: 400; }
.name::-webkit-calendar-picker-indicator, .name::-webkit-list-button { display: none !important; opacity: 0; }
.tag, .rm {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate);
  height: var(--row); display: inline-flex; align-items: center;
}
.rm { display: none; color: var(--ink); padding-left: 8px; }
.ex-head:focus-within .rm { display: inline-flex; }
.ex-head:focus-within .tag { display: none; }

.hist {
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; min-height: 26px; margin-top: -6px;
  font-family: var(--mono); font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums;
}
.hist .lastv { min-width: 0; overflow-wrap: anywhere; }
.copy {
  margin-left: auto; min-height: 32px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--slate);
  text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 4px;
}
.copy:hover { color: var(--ink); }

.set-row {
  display: grid; grid-template-columns: var(--bul) auto auto auto minmax(0, 1fr) auto;
  align-items: center; height: var(--row); margin-left: -10px;
}
.bullet { width: var(--bul); height: var(--row); display: grid; place-items: center; }
.bullet svg { width: 20px; height: 20px; overflow: visible; }
.bullet .ring { fill: none; stroke: var(--slate); stroke-width: 1.2; transition: stroke .2s; }
.bullet .fill {
  fill: var(--ink); transform-box: fill-box; transform-origin: center; transform: scale(0);
  transition: transform .34s cubic-bezier(.34, 1.56, .64, 1);
}
.bullet.done .ring { stroke: var(--ink); }
.bullet.done .fill { transform: scale(1); }
.set-row input {
  height: 30px; border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; padding: 0 1px;
  font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink);
}
.set-row input:placeholder-shown { border-bottom-color: var(--hair); }
.set-row input:focus { border-bottom-color: var(--ink); }
.set-row input::placeholder { font-size: 12px; }
.set-row .w { width: 6.2ch; text-align: right; }
.set-row .r { width: 4ch; }
.set-row .x { font-family: var(--mono); font-size: 13px; color: var(--slate); padding: 0 8px; }
.set-row .rm-set {
  grid-column: 6; width: 40px; height: var(--row); display: none; place-items: center;
  font-family: var(--mono); font-size: 15px; color: var(--slate);
}
.set-row:has(input:focus) .rm-set { display: grid; }

.pr-note {
  padding-left: calc(var(--bul) - 10px); margin-top: -8px; height: 26px; display: flex; align-items: center;
  font-family: var(--serif); font-style: italic; font-size: 15.5px; color: var(--ink);
}
.pr-note.fresh .t { animation: type .9s steps(30, end) both, fadein .5s ease-out both; }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fadein { from { opacity: 0; } }

.add-set {
  display: grid; grid-template-columns: var(--bul) auto; align-items: center; height: 36px; margin-left: -10px;
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; color: var(--slate);
}
.add-set .pl { text-align: center; font-size: 15px; }
.add-set:hover { color: var(--ink); }

.add-ex {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 56px; text-align: left;
  font-family: var(--serif); font-size: 19px; color: var(--slate);
}
.add-ex:hover { color: var(--ink); }
.add-ex .pl { font-family: var(--mono); font-size: 17px; }
.blank { min-height: 180px; cursor: text; }

.foot { padding-block: 8px 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--slate); line-height: 1.7; }

/* ---------- rest bar ---------- */
.restbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--hair);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.rb-in {
  max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 4px; height: 44px;
  font-family: var(--mono); color: var(--slate);
  transition: height .2s ease;
}
.restbar[data-state="run"] .rb-in, .restbar[data-state="done"] .rb-in { height: 58px; }
.rb-note { font-size: 10.5px; letter-spacing: .06em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb-start { margin-left: auto; height: 44px; font-size: 11px; letter-spacing: .1em; color: var(--slate); white-space: nowrap; }
.rb-start:hover { color: var(--ink); }
.rb-lbl { font-size: 10.5px; letter-spacing: .14em; width: 4.6em; }
.rb-time { font-size: 24px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.rb-btns { margin-left: auto; display: flex; align-items: center; }
.rb-btns button { min-width: 44px; height: 44px; padding: 0 6px; font-size: 13px; color: var(--slate); }
.rb-btns button:hover { color: var(--ink); }
.rb-btns .rb-x { font-size: 17px; color: var(--ink); }
.rb-prog { position: absolute; top: -1px; left: 0; height: 1px; background: var(--ink); width: 0; transition: width .25s linear; }
.restbar[data-state="done"] .rb-time, .restbar[data-state="done"] .rb-lbl { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 40px); display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--paper); padding: 4px 4px 4px 14px; border-radius: 2px;
  font-family: var(--mono); font-size: 12px; animation: rise .2s ease-out;
}
.toast button { color: var(--paper); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; padding: 0 10px; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }

@keyframes inkNext { from { opacity: 0; transform: translateX(12px); } }
@keyframes inkPrev { from { opacity: 0; transform: translateX(-12px); } }
.turn-next .sheet > *, .turn-next .title { animation: inkNext .22s ease-out; }
.turn-prev .sheet > *, .turn-prev .title { animation: inkPrev .22s ease-out; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="book" id="book">
  <header class="head gut">
    <div class="top">
      <div class="datenav">
        <button type="button" class="arrow" id="prev" aria-label="Previous day">&lt;</button>
        <span class="date" id="date"></span>
        <button type="button" class="arrow" id="next" aria-label="Next day">&gt;</button>
      </div>
      <button type="button" class="unit" id="unit"></button>
    </div>
    <input class="title" id="title" placeholder="Untitled session" autocomplete="off" maxlength="60" enterkeyhint="done" aria-label="Session title">
    <div class="meta">
      <span class="summary" id="summary"></span>
      <button type="button" class="todaybtn" id="todayBtn" hidden>back to today</button>
    </div>
    <div class="sample" id="sample" hidden>
      <span>Sample entries shown.</span>
      <button type="button" id="clearSample">Clear samples</button>
    </div>
  </header>

  <main class="sheet gut" id="sheet" aria-label="Workout log"></main>

  <footer class="foot gut">
    Tap • to complete a set. The rest timer starts on its own.<br>
    <span id="saveNote"></span>
  </footer>
</div>

<div class="restbar" id="restbar" data-state="idle">
  <div class="rb-prog" id="rbProg"></div>
  <div class="rb-in gut" id="rbIn"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="undo">Undo</button></div>
<datalist id="names"></datalist>

<script>
(() => {
  'use strict';
  const KEY = 'pocketlog.v2', OLD_KEY = 'pocketlog.v1';
  const LB = 2.2046226218;
  const $ = (s) => document.querySelector(s);
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  /* ---------- dates ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10);

  /* ---------- units ---------- */
  const round05 = (x) => Math.round(x * 2) / 2;
  const toKg = (w, u) => u === 'lb' ? w / LB : w;
  // value in the active unit; entries typed in the active unit are shown as typed, conversions round to 0.5
  function inUnit(w, u) {
    if (w == null) return null;
    if (u === state.unit) return w;
    return round05(state.unit === 'lb' ? w * LB : w / LB);
  }
  const num = (x) => String(Math.round(x * 100) / 100);
  const fmtSet = (s) => `${s.w == null ? 'BW' : num(inUnit(s.w, s.u))}×${s.r}`;

  /* ---------- storage ---------- */
  let storageOK = true;
  function readKey(k) { try { const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; } catch (e) { storageOK = false; return null; } }
  function normalize(s) {
    if (!s || typeof s !== 'object' || !s.days || typeof s.days !== 'object') return null;
    s.v = 2;
    s.unit = s.unit === 'lb' ? 'lb' : 'kg';
    s.rest = Number.isFinite(s.rest) ? Math.min(600, Math.max(15, s.rest)) : 90;
    s.prs = s.prs && typeof s.prs === 'object' ? s.prs : {};
    for (const k of Object.keys(s.days)) {
      const d = s.days[k];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !d || typeof d !== 'object') { delete s.days[k]; continue; }
      d.title = typeof d.title === 'string' ? d.title : '';
      d.ex = Array.isArray(d.ex) ? d.ex.filter(Boolean) : [];
      for (const e of d.ex) {
        e.id = e.id || uid();
        e.name = typeof e.name === 'string' ? e.name : '';
        e.sets = Array.isArray(e.sets) ? e.sets.filter(Boolean) : [];
        for (const st of e.sets) {
          st.id = st.id || uid();
          st.w = Number.isFinite(st.w) ? st.w : null;
          st.u = st.u === 'lb' || st.u === 'kg' ? st.u : s.unit;
          st.r = Number.isFinite(st.r) && st.r > 0 ? Math.round(st.r) : null;
          st.done = !!st.done && st.r != null;
        }
      }
    }
    return s;
  }
  function loadState() {
    const v2 = readKey(KEY);
    if (v2) return normalize(v2);
    const v1 = readKey(OLD_KEY); // earlier version stored plain numbers in its single unit
    if (v1 && v1.days) {
      const u = v1.unit === 'kg' ? 'kg' : 'lb';
      for (const d of Object.values(v1.days)) for (const e of (d.ex || [])) for (const st of (e.sets || [])) st.u = u;
      v1.unit = u;
      return normalize(v1);
    }
    return null;
  }
  function seed() {
    const mk = (arr, doneN) => arr.map(([w, r], i) => ({ id: uid(), w, u: 'kg', r, done: i < doneN }));
    const t = todayKey(), p = addDays(t, -3), q = addDays(t, -7);
    return normalize({ unit: 'kg', rest: 90, days: {
      [q]: { title: 'Upper', sampleTitle: true, ex: [
        { id: uid(), sample: true, name: 'Bench Press', sets: mk([[80, 8], [90, 6], [92.5, 5]], 3) },
        { id: uid(), sample: true, name: 'Overhead Press', sets: mk([[50, 8], [50, 8], [52.5, 6]], 3) },
      ] },
      [p]: { title: 'Upper', sampleTitle: true, ex: [
        { id: uid(), sample: true, name: 'Bench Press', sets: mk([[80, 8], [90, 6], [95, 5]], 3) },
        { id: uid(), sample: true, name: 'Overhead Press', sets: mk([[50, 8], [52.5, 7], [52.5, 6]], 3) },
        { id: uid(), sample: true, name: 'Pull-up', sets: mk([[null, 10], [null, 8], [null, 7]], 3) },
      ] },
      [t]: { title: 'Upper', sampleTitle: true, ex: [
        { id: uid(), sample: true, name: 'Bench Press', sets: mk([[80, 8], [97.5, 5], [100, 3]], 2) },
        { id: uid(), sample: true, name: 'Overhead Press', sets: [] },
      ] },
    } });
  }

  let state = loadState() || seed();
  let cur = todayKey();
  let rendering = false;
  let prMap = new Map(); // set id -> previous record {w,u}

  function prune() {
    for (const k of Object.keys(state.days)) {
      const d = state.days[k];
      if (k !== cur && !d.title && !d.ex.length) delete state.days[k];
    }
  }
  let saveT = 0;
  function persist() {
    clearTimeout(saveT);
    prune();
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; } catch (e) { storageOK = false; }
    $('#saveNote').textContent = storageOK ? 'Everything saves on this device and works offline.' : 'Not saving: this browser blocks storage.';
    if (timer.state === 'idle') renderBar();
  }
  const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(persist, 300); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);

  /* ---------- model helpers ---------- */
  const getDay = (k) => state.days[k] || { title: '', ex: [] };
  const ensureDay = (k) => (state.days[k] = state.days[k] || { title: '', ex: [] });
  const findEx = (id) => getDay(cur).ex.find(e => e.id === id);
  const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, ' ');
  const haptic = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  function findLast(name) {
    const n = norm(name);
    if (!n) return null;
    const keys = Object.keys(state.days).filter(k => k < cur).sort().reverse();
    for (const k of keys) {
      const e = state.days[k].ex.find(x => norm(x.name) === n && x.sets.some(s => s.r));
      if (e) return { k, sets: e.sets.filter(s => s.r) };
    }
    return null;
  }
  // Walk every completed set in date order; a set is a PR when it beats the best weight logged before it.
  function recomputePRs() {
    const best = {};
    prMap = new Map();
    for (const k of Object.keys(state.days).sort()) {
      for (const e of state.days[k].ex) {
        const n = norm(e.name);
        if (!n) continue;
        for (const s of e.sets) {
          if (!s.done || s.w == null) continue;
          const kg = toKg(s.w, s.u), b = best[n];
          if (b && kg > b.kg + 1e-6) prMap.set(s.id, { w: b.w, u: b.u });
          if (!b || kg > b.kg + 1e-6) best[n] = { kg, w: s.w, u: s.u, date: k, name: e.name.trim() };
        }
      }
    }
    state.prs = best;
  }
  function prText(s) {
    const prev = prMap.get(s.id);
    if (!prev) return '';
    const diff = Math.round((inUnit(s.w, s.u) - inUnit(prev.w, prev.u)) * 100) / 100;
    return diff > 0 ? `↳ New PR — up by +${num(diff)} ${state.unit}` : '↳ New PR';
  }

  /* ---------- elements ---------- */
  const book = $('#book'), sheet = $('#sheet'), titleEl = $('#title');
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- header ---------- */
  function renderHead() {
    const d = parse(cur), now = new Date();
    const yr = d.getFullYear() !== now.getFullYear() ? ` ${d.getFullYear()}` : '';
    $('#date').innerHTML = `${MON[d.getMonth()]} ${d.getDate()}${yr} <span class="sep">//</span> ${DOW[d.getDay()]}`;
    $('#date').setAttribute('aria-label', d.toDateString());
    $('#todayBtn').hidden = cur === todayKey();
    if (document.activeElement !== titleEl) titleEl.value = getDay(cur).title || '';
    $('#sample').hidden = !Object.values(state.days).some(x => x.ex.some(e => e.sample));
    const u = state.unit;
    $('#unit').innerHTML = u === 'kg' ? '[ <b>KG</b> / LB ]' : '[ KG / <b>LB</b> ]';
    $('#unit').setAttribute('aria-label', `Units: ${u}. Switch to ${u === 'kg' ? 'lb' : 'kg'}`);
    updateSummary();
  }
  function updateSummary() {
    const exs = getDay(cur).ex.filter(e => e.name.trim() || e.sets.length);
    if (!exs.length) { $('#summary').textContent = 'Blank page'; return; }
    const sets = exs.flatMap(e => e.sets).filter(s => s.r);
    const done = sets.filter(s => s.done);
    const vol = done.reduce((a, s) => a + (s.w == null ? 0 : inUnit(s.w, s.u)) * s.r, 0);
    const parts = [`${exs.length} exercise${exs.length === 1 ? '' : 's'}`, `${done.length}/${sets.length} sets`];
    if (vol) parts.push(`${Math.round(vol).toLocaleString('en-US')} ${state.unit} moved`);
    $('#summary').textContent = parts.join(' · ');
  }
  function refreshNames() {
    const seen = new Map();
    for (const k of Object.keys(state.days).sort().reverse())
      for (const e of state.days[k].ex) { const n = e.name.trim(); if (n && !seen.has(norm(n))) seen.set(norm(n), n); }
    $('#names').innerHTML = [...seen.values()].map(n => `<option value="${esc(n)}"></option>`).join('');
  }

  /* ---------- sheet ---------- */
  function renderSheet(focusSel) {
    rendering = true;
    const day = getDay(cur);
    sheet.textContent = '';
    day.ex.forEach(ex => sheet.append(buildEx(ex)));
    const add = el('button', 'add-ex', '<span class="pl">+</span>Add Exercise');
    add.type = 'button'; add.dataset.act = 'add-ex';
    sheet.append(add);
    const blank = el('div', 'blank');
    blank.setAttribute('aria-hidden', 'true');
    sheet.append(blank);
    rendering = false;
    if (focusSel) focusIn(focusSel);
  }
  function rerenderEx(ex, focusSel) {
    const old = sheet.querySelector(`[data-ex="${ex.id}"]`);
    if (!old) { renderSheet(focusSel); return; }
    rendering = true;
    old.replaceWith(buildEx(ex));
    rendering = false;
    if (focusSel) focusIn(focusSel);
    updateSummary();
  }
  function focusIn(sel) {
    const n = sheet.querySelector(sel);
    if (!n) return;
    n.focus();
    if (n.select) { try { n.select(); } catch (e) {} }
  }

  function buildEx(ex) {
    const sec = el('section', 'ex');
    sec.dataset.ex = ex.id;
    const head = el('div', 'ex-head');
    const inp = el('input', 'name');
    inp.id = 'n-' + ex.id;
    inp.value = ex.name;
    inp.placeholder = 'Exercise name';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.maxLength = 60;
    inp.setAttribute('list', 'names');
    inp.setAttribute('enterkeyhint', 'next');
    inp.setAttribute('autocapitalize', 'words');
    inp.setAttribute('aria-label', 'Exercise name');
    head.append(inp);
    if (ex.sample) head.append(el('span', 'tag', 'sample'));
    const rm = el('button', 'rm', 'remove');
    rm.type = 'button'; rm.dataset.act = 'rm-ex'; rm.dataset.keep = '';
    head.append(rm);
    sec.append(head);
    const hist = buildHist(ex);
    if (hist) sec.append(hist);
    ex.sets.forEach((s, i) => {
      sec.append(buildSet(s, i));
      const t = prText(s);
      if (t) sec.append(noteEl(t, false));
    });
    const add = el('button', 'add-set', '<span class="pl">+</span>add set');
    add.type = 'button'; add.dataset.act = 'add-set'; add.dataset.keep = '';
    add.setAttribute('aria-label', `Add set to ${ex.name || 'exercise'}`);
    sec.append(add);
    return sec;
  }
  function buildHist(ex) {
    const last = findLast(ex.name);
    const pr = state.prs[norm(ex.name)];
    if (!last && !pr) return null;
    const h = el('div', 'hist');
    if (last) h.append(el('span', 'lastv', `Last: ${last.sets.map(fmtSet).join(', ')}`));
    if (pr) h.append(el('span', '', `PR ${num(inUnit(pr.w, pr.u))} ${state.unit}`));
    const logged = ex.sets.filter(s => s.r).length;
    if (last && last.sets.length > logged) {
      const c = el('button', 'copy', logged ? 'copy rest' : 'copy last');
      c.type = 'button'; c.dataset.act = 'copy'; c.dataset.keep = '';
      c.setAttribute('aria-label', `Copy last session's sets for ${ex.name}`);
      h.append(c);
    }
    return h;
  }
  function buildSet(s, i) {
    const row = el('div', 'set-row');
    row.dataset.set = s.id;
    const wv = s.w == null ? '' : num(inUnit(s.w, s.u));
    row.innerHTML =
      `<button type="button" class="bullet${s.done ? ' done' : ''}" data-act="toggle" aria-pressed="${s.done}" aria-label="Set ${i + 1} complete">` +
        `<svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ring" cx="10" cy="10" r="4.4"/><circle class="fill" cx="10" cy="10" r="4.4"/></svg></button>` +
      `<input class="w" id="w-${s.id}" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="${state.unit}" value="${wv}" aria-label="Set ${i + 1} weight in ${state.unit}, blank for bodyweight">` +
      `<span class="x">×</span>` +
      `<input class="r" id="r-${s.id}" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" placeholder="reps" value="${s.r == null ? '' : s.r}" aria-label="Set ${i + 1} reps">` +
      `<button type="button" class="rm-set" data-act="rm-set" data-keep aria-label="Delete set ${i + 1}">×</button>`;
    return row;
  }
  function noteEl(text, fresh) {
    const n = el('div', 'pr-note' + (fresh ? ' fresh' : ''));
    n.append(el('span', 't', esc(text)));
    return n;
  }
  // Bring PR notes and history lines on the page in line with the current records, animating only new notes.
  function syncNotes(freshId) {
    sheet.querySelectorAll('.ex').forEach(sec => {
      const ex = findEx(sec.dataset.ex);
      if (!ex) return;
      for (const s of ex.sets) {
        const row = sec.querySelector(`.set-row[data-set="${s.id}"]`);
        if (!row) continue;
        const nx = row.nextElementSibling;
        const note = nx && nx.classList.contains('pr-note') ? nx : null;
        const t = prText(s);
        if (t && note) { if (note.textContent !== t) note.firstChild.textContent = t; }
        else if (t) row.after(noteEl(t, s.id === freshId));
        else if (note) note.remove();
      }
      const old = sec.querySelector('.hist'), next = buildHist(ex);
      if (old && next) { if (old.innerHTML !== next.innerHTML) old.replaceWith(next); }
      else if (old) old.remove();
      else if (next) sec.querySelector('.ex-head').after(next);
    });
  }

  /* ---------- actions ---------- */
  function addExercise() {
    const ex = { id: uid(), name: '', sets: [] };
    ensureDay(cur).ex.push(ex);
    renderSheet('#n-' + ex.id);
    const n = sheet.querySelector('#n-' + ex.id);
    if (n) n.scrollIntoView({ block: 'nearest' });
  }
  function addSet(ex) {
    const last = findLast(ex.name);
    const prev = ex.sets[ex.sets.length - 1] || (last && last.sets[ex.sets.length]) || null;
    const s = { id: uid(), w: prev ? prev.w : null, u: prev ? prev.u : state.unit, r: prev ? prev.r : null, done: false };
    ex.sets.push(s);
    saveSoon();
    rerenderEx(ex, '#w-' + s.id);
  }
  function copyLast(ex) {
    const last = findLast(ex.name);
    if (!last) return;
    ex.sets = ex.sets.filter(s => s.r || s.w != null);
    for (const s of last.sets.slice(ex.sets.length)) ex.sets.push({ id: uid(), w: s.w, u: s.u, r: s.r, done: false });
    haptic(8);
    persist();
    rerenderEx(ex);
  }
  function toggleSet(btn) {
    const sec = btn.closest('[data-ex]'), ex = findEx(sec.dataset.ex);
    const s = ex && ex.sets.find(x => x.id === btn.closest('.set-row').dataset.set);
    if (!s) return;
    if (!s.done && !s.r) { focusIn('#r-' + s.id); return; } // need reps before it counts
    unlockAudio();
    s.done = !s.done;
    btn.classList.toggle('done', s.done);
    btn.setAttribute('aria-pressed', String(s.done));
    recomputePRs();
    syncNotes(s.done ? s.id : null);
    updateSummary();
    if (s.done) {
      haptic(prMap.has(s.id) ? [10, 60, 10] : 8);
      startRest();
    }
    persist();
  }
  let undoData = null, toastT = 0;
  function snapshot() { undoData = { k: cur, json: JSON.stringify(getDay(cur)) }; }
  function toast(msg) {
    $('#toastMsg').textContent = msg;
    $('#toast').hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { $('#toast').hidden = true; undoData = null; }, 5000);
  }
  $('#undo').addEventListener('click', () => {
    if (!undoData) return;
    state.days[undoData.k] = JSON.parse(undoData.json);
    cur = undoData.k;
    undoData = null;
    $('#toast').hidden = true;
    recomputePRs();
    persist();
    render();
  });
  function removeEx(ex) {
    snapshot();
    const day = ensureDay(cur);
    day.ex = day.ex.filter(e => e !== ex);
    recomputePRs();
    persist();
    renderSheet();
    updateSummary();
    toast(`${ex.name.trim() || 'Exercise'} removed`);
  }
  function removeSet(ex, id, quiet) {
    if (!quiet) snapshot();
    ex.sets = ex.sets.filter(s => s.id !== id);
    recomputePRs();
    persist();
    rerenderEx(ex);
    syncNotes(null);
    if (!quiet) toast('Set removed');
  }
  function goTo(k, dir) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    cur = k;
    render();
    book.classList.remove('turn-next', 'turn-prev');
    void book.offsetWidth;
    book.classList.add(dir > 0 ? 'turn-next' : 'turn-prev');
    clearTimeout(goTo.t);
    goTo.t = setTimeout(() => book.classList.remove('turn-next', 'turn-prev'), 300);
  }

  /* ---------- rest timer ---------- */
  const timer = { state: 'idle', end: 0, dur: 90, iv: 0, hideT: 0 };
  let actx = null;
  function unlockAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function chime() {
    if (!actx) return;
    try {
      const t = actx.currentTime;
      [[659.25, 0], [987.77, 0.16]].forEach(([f, d]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t + d);
        g.gain.linearRampToValueAtTime(0.07, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 1.4);
        o.connect(g); g.connect(actx.destination);
        o.start(t + d); o.stop(t + d + 1.5);
      });
    } catch (e) {}
  }
  const mmss = (sec) => `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
  function startRest(sec) {
    timer.dur = sec || state.rest;
    timer.end = Date.now() + timer.dur * 1000;
    timer.state = 'run';
    state.timer = { end: timer.end, dur: timer.dur };
    clearTimeout(timer.hideT);
    renderBar();
    clearInterval(timer.iv);
    timer.iv = setInterval(tick, 250);
    tick();
  }
  function stopRest() {
    clearInterval(timer.iv);
    clearTimeout(timer.hideT);
    timer.state = 'idle';
    state.timer = null;
    saveSoon();
    renderBar();
  }
  function adjustRest(d) {
    state.rest = Math.min(600, Math.max(15, state.rest + d));
    if (timer.state === 'done') { if (d > 0) startRest(d); else return; }
    else {
      timer.end += d * 1000;
      timer.dur = Math.max(1, timer.dur + d);
      state.timer = { end: timer.end, dur: timer.dur };
      tick();
    }
    saveSoon();
  }
  function tick() {
    if (timer.state === 'idle') return;
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    const t = $('#rbTime');
    if (t) t.textContent = mmss(left);
    $('#rbProg').style.width = timer.state === 'run' ? `${Math.min(100, (left / timer.dur) * 100)}%` : '0%';
    if (left <= 0 && timer.state === 'run') {
      timer.state = 'done';
      state.timer = null;
      clearInterval(timer.iv);
      renderBar();
      chime();
      haptic([30, 80, 30]);
      timer.hideT = setTimeout(stopRest, 30000);
      saveSoon();
    }
  }
  function renderBar() {
    const bar = $('#restbar'), inn = $('#rbIn');
    bar.dataset.state = timer.state;
    if (timer.state === 'idle') {
      $('#rbProg').style.width = '0%';
      inn.innerHTML = `<span class="rb-note">${storageOK ? 'Saved offline' : 'Not saving'}</span>` +
        `<button type="button" class="rb-start" id="rbStart" aria-label="Start ${state.rest} second rest timer">REST ${mmss(state.rest)} ▸</button>`;
      return;
    }
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    inn.innerHTML =
      `<span class="rb-lbl">${timer.state === 'done' ? 'GO' : 'REST'}</span>` +
      `<span class="rb-time" id="rbTime" role="timer" aria-live="off">${mmss(left)}</span>` +
      `<div class="rb-btns">` +
        `<button type="button" data-rb="-15" aria-label="Remove 15 seconds">-15s</button>` +
        `<button type="button" data-rb="15" aria-label="Add 15 seconds">+15s</button>` +
        `<button type="button" class="rb-x" data-rb="x" aria-label="Dismiss rest timer">×</button>` +
      `</div>`;
  }
  $('#restbar').addEventListener('click', (e) => {
    if (e.target.closest('#rbStart')) { unlockAudio(); startRest(); return; }
    const b = e.target.closest('[data-rb]');
    if (!b) return;
    if (b.dataset.rb === 'x') stopRest(); else adjustRest(Number(b.dataset.rb));
  });

  /* ---------- events ---------- */
  // Buttons marked data-keep don't steal focus, so the keyboard stays open until the click runs.
  document.addEventListener('mousedown', (e) => { if (e.target.closest('[data-keep]')) e.preventDefault(); });
  let hadFocusAtDown = false;
  document.addEventListener('pointerdown', () => {
    const a = document.activeElement;
    hadFocusAtDown = !!(a && a.tagName === 'INPUT');
  }, true);

  sheet.addEventListener('click', (e) => {
    const t = e.target;
    const act = t.closest('[data-act]');
    if (act) {
      const sec = act.closest('[data-ex]');
      const ex = sec && findEx(sec.dataset.ex);
      switch (act.dataset.act) {
        case 'add-ex': addExercise(); break;
        case 'add-set': if (ex) addSet(ex); break;
        case 'copy': if (ex) copyLast(ex); break;
        case 'rm-ex': if (ex) removeEx(ex); break;
        case 'rm-set': if (ex) removeSet(ex, act.closest('.set-row').dataset.set); break;
        case 'toggle': toggleSet(act); break;
      }
      return;
    }
    if (t.closest('.blank') && !hadFocusAtDown) addExercise();
  });

  sheet.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key !== 'Enter') return;
    if (t.classList.contains('name')) {
      e.preventDefault();
      const ex = findEx(t.closest('[data-ex]').dataset.ex);
      if (!t.value.trim()) { t.blur(); return; }
      ex.name = t.value.trim();
      addSet(ex);
    } else if (t.classList.contains('w')) {
      e.preventDefault();
      focusIn('#r-' + t.closest('.set-row').dataset.set);
    } else if (t.classList.contains('r')) {
      e.preventDefault();
      t.blur();
    }
  });

  let histT = 0;
  sheet.addEventListener('input', (e) => {
    const t = e.target;
    const sec = t.closest('[data-ex]');
    const ex = sec && findEx(sec.dataset.ex);
    if (!ex) return;
    if (t.classList.contains('name')) {
      ex.name = t.value;
      if (ex.name.trim()) delete ex.sample;
      clearTimeout(histT);
      histT = setTimeout(() => { recomputePRs(); syncNotes(null); }, 200);
    } else if (t.classList.contains('w') || t.classList.contains('r')) {
      const s = ex.sets.find(x => x.id === t.closest('.set-row').dataset.set);
      if (!s) return;
      if (t.classList.contains('w')) {
        const v = t.value.trim().replace(',', '.');
        const w = v === '' ? null : parseFloat(v);
        if (v === '' || (Number.isFinite(w) && w >= 0 && w < 10000)) { s.w = w; s.u = state.unit; }
      } else {
        const r = parseInt(t.value, 10);
        s.r = r > 0 && r < 1000 ? r : null;
        if (!s.r && s.done) {
          s.done = false;
          const b = t.closest('.set-row').querySelector('.bullet');
          b.classList.remove('done'); b.setAttribute('aria-pressed', 'false');
        }
      }
      if (s.done) { recomputePRs(); syncNotes(s.id); }
    }
    updateSummary();
    saveSoon();
  });

  sheet.addEventListener('focusout', (e) => {
    if (rendering) return;
    const t = e.target;
    if (t.classList.contains('name')) {
      const sec = t.closest('[data-ex]');
      const ex = sec && findEx(sec.dataset.ex);
      if (!ex || !t.isConnected) return;
      ex.name = ex.name.trim();
      if (!ex.name && !ex.sets.length) {
        const day = ensureDay(cur);
        day.ex = day.ex.filter(x => x !== ex);
        sec.remove();
      } else {
        recomputePRs();
        syncNotes(null);
      }
      persist();
      refreshNames();
      updateSummary();
      return;
    }
    const row = t.closest('.set-row');
    if (row) {
      setTimeout(() => {
        if (!row.isConnected || row.contains(document.activeElement)) return;
        const sec = row.closest('[data-ex]'), ex = sec && findEx(sec.dataset.ex);
        const s = ex && ex.sets.find(x => x.id === row.dataset.set);
        if (s && s.w == null && s.r == null) { removeSet(ex, s.id, true); return; }
        if (s && s.w != null) { // tidy what was typed, e.g. "100." -> "100"
          const inp = row.querySelector('.w');
          if (inp && document.activeElement !== inp) inp.value = num(inUnit(s.w, s.u));
        }
        persist();
      }, 0);
    }
  });

  titleEl.addEventListener('input', () => {
    const d = ensureDay(cur);
    d.title = titleEl.value;
    delete d.sampleTitle;
    saveSoon();
  });
  titleEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); } });
  titleEl.addEventListener('blur', () => { const d = ensureDay(cur); d.title = titleEl.value.trim(); titleEl.value = d.title; persist(); });

  $('#prev').addEventListener('click', () => goTo(addDays(cur, -1), -1));
  $('#next').addEventListener('click', () => goTo(addDays(cur, 1), 1));
  $('#todayBtn').addEventListener('click', () => { const t = todayKey(); goTo(t, t > cur ? 1 : -1); });
  $('#unit').addEventListener('click', () => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    state.unit = state.unit === 'kg' ? 'lb' : 'kg';
    persist();
    render();
  });
  $('#clearSample').addEventListener('click', () => {
    for (const k of Object.keys(state.days)) {
      const d = state.days[k];
      d.ex = d.ex.filter(e => !e.sample);
      if (d.sampleTitle) { d.title = ''; delete d.sampleTitle; }
      if (!d.ex.length && !d.title) delete state.days[k];
    }
    recomputePRs();
    persist();
    render();
  });

  // swipe to turn the page
  let sw = null;
  book.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { sw = null; return; }
    const t = e.touches[0];
    sw = { x: t.clientX, y: t.clientY, t: Date.now(), ok: !e.target.closest('input') };
  }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (!sw || !sw.ok) { sw = null; return; }
    const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && Date.now() - sw.t < 700) {
      const dir = dx < 0 ? 1 : -1;
      goTo(addDays(cur, dir), dir);
    }
    sw = null;
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    const a = document.activeElement;
    if (a && a.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') goTo(addDays(cur, -1), -1);
    else if (e.key === 'ArrowRight') goTo(addDays(cur, 1), 1);
  });

  function render() { renderHead(); renderSheet(); refreshNames(); }
  recomputePRs();
  render();
  // resume a rest timer that was running before a reload
  if (state.timer && state.timer.end > Date.now()) {
    timer.dur = state.timer.dur || state.rest;
    timer.end = state.timer.end;
    timer.state = 'run';
    renderBar();
    timer.iv = setInterval(tick, 250);
    tick();
  } else {
    state.timer = null;
  }
  persist();
})();
</script>
<!-- page:end -->
</body>
</html>
